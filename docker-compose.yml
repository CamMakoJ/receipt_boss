services:
  receipt-boss:
    build: .
    image: receipt-boss:latest
    container_name: receipt-boss
    restart: unless-stopped
    ports:
      - "3000:3000"            # change the left number to publish on another port
    environment:
      # HTTPS (needed for phone camera / offline / install). Put PEM files in ./certs
      # TLS_CERT: /certs/cert.pem
      # TLS_KEY: /certs/key.pem
      # Or terminate TLS in a reverse proxy (Caddy/nginx/Traefik) and set:
      # TRUST_PROXY: "1"
      TZ: America/Vancouver     # backup schedule / dates use the container's clock
    volumes:
      - ./data:/data            # database, photos, local backups  (back this folder up!)
      - ./rclone:/config        # rclone config for Google Drive backups
      # - ./certs:/certs:ro
    # Local AI on the host (e.g. Ollama / LM Studio): use http://host.docker.internal:11434/v1 in Settings -> AI
    extra_hosts:
      - "host.docker.internal:host-gateway"
